<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canteen Token System</title>
  <style>
    :root {
      --ink: #1d2b24;
      --muted: #6b7a72;
      --line: #dfe6e1;
      --accent: #1f6f4a;
      --soldout: #b3402f;
      --bg: #f7f9f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 28px 0 10px; }
    .sub { color: var(--muted); margin: 0 0 8px; }

    /* Now serving board */
    .board {
      background: var(--ink);
      color: #fff;
      border-radius: 12px;
      padding: 18px 20px;
      margin-top: 16px;
    }
    .board small { color: #b9c8bf; display: block; }
    #nowServing { font-size: 2.4rem; font-weight: 700; margin: 0; }

    /* Menu */
    .category {
      font-weight: 700;
      margin-top: 18px;
      padding-bottom: 4px;
      border-bottom: 2px solid var(--accent);
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 2px;
      border-bottom: 1px solid var(--line);
    }
    .item.soldout { color: #9aa6a0; }
    .item.soldout .label { text-decoration: line-through; }
    .badge {
      background: #f6e3df;
      color: var(--soldout);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Token */
    #myToken { font-size: 1.2rem; margin: 6px 0 12px; }
    button {
      font: inherit;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    button:focus-visible { outline: 3px solid #9bd3b6; outline-offset: 2px; }
    #waitTime { color: var(--muted); margin-top: 10px; }
  </style>
</head>

<body>
<main>
  <h1>Canteen Token System</h1>
  <p class="sub">Get a token, skip the crowd, and watch your turn come up.</p>

  <div class="board">
    <small>Now serving</small>
    <p id="nowServing">0</p>
  </div>

  <h2>Your token</h2>
  <p id="myToken">You don't have a token yet.</p>
  <button id="getToken">Get Token</button>
  <p id="waitTime"></p>

  <h2>Menu</h2>
  <div id="menuContainer">Loading menu...</div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getDatabase, ref, onValue, get, runTransaction } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  // Firebase project: canteen-token-system-63b9e (the team's shared database)
  const firebaseConfig = {
    apiKey: "AIzaSyBTdRI4iiXFJ7vls4X7i-5AC8mc5fcFJu4",
    authDomain: "canteen-token-system-63b9e.firebaseapp.com",
    databaseURL: "https://canteen-token-system-63b9e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "canteen-token-system-63b9e",
    storageBucket: "canteen-token-system-63b9e.firebasestorage.app",
    messagingSenderId: "206942062522",
    appId: "1:206942062522:web:3e7f95177c175678e43f83"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ---- Load and display the menu, grouped by category ----
  const menuRef = ref(db, "menu");

  onValue(menuRef, (snapshot) => {
    const items = snapshot.val();
    const container = document.getElementById("menuContainer");
    container.innerHTML = "";

    if (!items) {
      container.textContent = "No menu items yet.";
      return;
    }

    const categories = {};
    for (const key in items) {
      const item = items[key];
      if (!categories[item.category]) categories[item.category] = [];
      categories[item.category].push(item);
    }

    for (const cat in categories) {
      const catDiv = document.createElement("div");
      catDiv.className = "category";
      catDiv.textContent = cat;
      container.appendChild(catDiv);

      categories[cat].forEach((item) => {
        const row = document.createElement("div");
        row.className = "item" + (item.inStock ? "" : " soldout");
        row.innerHTML =
          `<span class="label">${item.name} - Rs.${item.price}</span>` +
          (item.inStock ? "" : '<span class="badge">Sold out</span>');
        container.appendChild(row);
      });
    }
  });

  // ---- Live "Now Serving" display + live wait-time updates ----
  let myTokenNumber = null; // set once you book a token

  function updateMyWaitDisplay(currentServingValue) {
    if (myTokenNumber === null) return;

    const tokensAhead = myTokenNumber - currentServingValue;
    const myTokenText = document.getElementById("myToken");
    const waitText = document.getElementById("waitTime");

    if (tokensAhead <= 0) {
      myTokenText.textContent = "Your token: " + myTokenNumber + " - it's your turn now!";
      waitText.textContent = "Waiting time: 0 min";
    } else {
      const estWait = tokensAhead * 2; // 2 min per token, adjust as needed
      myTokenText.textContent =
        "Your token: " + myTokenNumber + " (" + tokensAhead + " ahead)";
      waitText.textContent = "Estimated wait: ~" + estWait + " min";
    }
  }

  const currentServingRef = ref(db, "tokens/currentServing");

  onValue(currentServingRef, (snapshot) => {
    const currentServingValue = snapshot.val() || 0;
    document.getElementById("nowServing").textContent = currentServingValue;
    updateMyWaitDisplay(currentServingValue);
  });

  // ---- Get a new token ----
  // runTransaction makes sure two people pressing at the same moment
  // never receive the same token number (this is the "fairness" part).
  const getTokenBtn = document.getElementById("getToken");

  getTokenBtn.onclick = async function () {
    getTokenBtn.disabled = true;
    try {
      const lastIssuedRef = ref(db, "tokens/lastIssued");
      const result = await runTransaction(lastIssuedRef, (current) => (current || 0) + 1);
      myTokenNumber = result.snapshot.val();

      const currentServingSnap = await get(currentServingRef);
      updateMyWaitDisplay(currentServingSnap.val() || 0);
    } catch (err) {
      document.getElementById("myToken").textContent =
        "Could not get a token. Check your connection and try again.";
      console.error(err);
    }
    getTokenBtn.disabled = false;
  };
</script>
</body>
</html>
